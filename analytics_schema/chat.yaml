  - feedback_action
  optional_properties:
  - feedback_issue_type
  - feedback_issue_count_bucket
  - entry_point
  - trigger_source
  allowed_values:
    surface:
    - chat
    - unknown
    feedback_action:
    - thumbs_up
    - thumbs_down
    - report_issue
    feedback_issue_type:
    - couldnt_hear_me
    - misheard_me
    - interrupted_me
    - responded_too_slowly
    - voice_didnt_sound_right
    - didnt_like_responses
    - other
    - multiple
    - unknown
    feedback_issue_count_bucket:
    - '0'
    - '1'
    - '2'
    - 3_plus
    entry_point:
    - chat_tab
    - home
    - device
    - kws
    - siri_shortcut
    - app_shortcut
    - deep_link
    - push
    - system_share
    - unknown
    trigger_source:
    - user
    - system
    - device
    - server_push
    - unknown
  privacy_notes: Do not include issue description, email, nickname, serial number, contact details, chat text, prompt text, answer text, message id, or raw feedback payload. Do not include chat text, prompts, answers, transcript text, audio content, image content, memory content, decrypted plaintext, tool arguments, command text, conversation ids, message ids, raw errors, request ids, response bodies, or stack traces.
  ga4_custom_definitions:
  - surface
  - feedback_action
  - feedback_issue_type
  - feedback_issue_count_bucket
  - entry_point
  - trigger_source
  - platform
  - environment
  - build_region
  dashboard_usage:
  - chat_feedback_volume
  - chat_feedback_breakdown
  verification_android:
  - Enable GA4 DebugView for the Android app stream.
  - Submit thumbs_up, thumbs_down, single issue, and multi-issue feedback and confirm feedback_action and issue bucketing rules.
  - Confirm the event routes through the Android analytics tracker/adapter and uses platform=android.
  - Confirm no chat text, prompt text, answer text, transcript text, audio, image content, memory content, decrypted plaintext, tool arguments, command text, ids, raw errors, or stack traces are present.
  verification_ios:
  - Enable GA4 DebugView for the iOS app stream.
  - Submit equivalent feedback paths and confirm feedback_action and issue bucketing rules match Android.
  - Confirm the iOS analytics facade emits the same event name, params, and enum values as Android with platform=ios.
  - Confirm no chat text, prompt text, answer text, transcript text, audio, image content, memory content, decrypted plaintext, tool arguments, command text, ids, raw errors, or stack traces are present.
