schema_version: 2
owner: chat
platforms:
- android
- ios
common_properties:
  injected_by_adapter:
  - platform
  - environment
  - build_region
  - build_type
  - app_version_name
  - app_version_code
  definitions:
    platform: Lowercase client platform, such as android or ios.
    environment: Analytics environment, test or prod.
    build_region: Analytics build region. Current Android rule is prod -> us, test -> sg.
    build_type: Client build type such as debug or release.
    app_version_name: Public app version name injected by the client adapter.
    app_version_code: Numeric app version code injected by the client adapter.
implementation_contract:
  android_contract_layer: domain:api:analytics
  android_tracker: AnalyticsTracker
  android_event_type: AnalyticsEvent
  android_event_spec_type: AnalyticsEventSpec
  android_provider_adapter: Ga4AnalyticsAdapter
  android_direct_sdk_boundary: Only the app-level provider adapter may call FirebaseAnalytics. Business, feature, domain, and data code must use typed reporters or AnalyticsTracker.
  ios_contract_layer: iOS analytics facade matching this schema
  ios_provider_adapter: GA4/Firebase adapter behind the iOS facade
  ios_direct_sdk_boundary: Only the iOS provider adapter may call Firebase Analytics.logEvent. Business code must use the facade.
  required_tests:
  - ga4_event_name_rules
  - ga4_param_name_rules
  - ga4_param_count_limit
  - reserved_prefix_guardrails
  - privacy_field_guardrails
  - reporter_output_contract
events:
- event_name: chat_list_viewed
  goal: Measure Chat entry exposure with the smallest cross-platform entry signal.
  recommended_or_custom: custom
  key_event: false
  trigger_android: User opens Chat and the conversation list or default conversation region becomes visible.
  trigger_ios: User opens Chat and the conversation list or default conversation region becomes visible.
  required_properties:
  - entry_point
  - surface
  optional_properties:
  - trigger_source
  allowed_values:
    entry_point:
    - chat_tab
    - home
    - device
    - kws
    - siri_shortcut
    - app_shortcut
    - deep_link
    - push
    - system_share
    - unknown
    surface:
    - chat
    - unknown
    trigger_source:
    - user
    - system
    - device
    - server_push
    - unknown
  privacy_notes: Do not include conversation title, message content, session id, or raw list payload. Do not include chat text, prompts, answers, transcript text, audio content, image content, memory content, decrypted plaintext, tool arguments, command text, conversation ids, message ids, raw errors, request ids, response bodies, or stack traces.
  ga4_custom_definitions:
  - entry_point
  - surface
  - trigger_source
  - platform
  - environment
  - build_region
  dashboard_usage:
  - chat_entry_funnel
  - chat_list_exposure
  verification_android:
  - Enable GA4 DebugView for the Android app stream.
  - Enter Chat from tab and Home and confirm chat_list_viewed fires once with approved entry_point and surface values.
  - Confirm the event routes through the Android analytics tracker/adapter and uses platform=android.
  - Confirm no chat text, prompt text, answer text, transcript text, audio, image content, memory content, decrypted plaintext, tool arguments, command text, ids, raw errors, or stack traces are present.
  verification_ios:
  - Enable GA4 DebugView for the iOS app stream.
  - Enter Chat from tab/default entry and confirm chat_list_viewed fires once with the same enum values as Android.
  - Confirm the iOS analytics facade emits the same event name, params, and enum values as Android with platform=ios.
  - Confirm no chat text, prompt text, answer text, transcript text, audio, image content, memory content, decrypted plaintext, tool arguments, command text, ids, raw errors, or stack traces are present.
- event_name: chat_session_opened
  goal: Measure default, historical, and restored Chat session opens without platform-specific naming.
  recommended_or_custom: custom
  key_event: false
  trigger_android: The app opens a default, historical, or restored Chat session.
  trigger_ios: The app opens a default, historical, or restored Chat session.
  required_properties:
  - surface
  - open_mode
  optional_properties:
  - entry_point
  - trigger_source
  allowed_values:
    surface:
    - chat
    - unknown
    open_mode:
    - default_session
    - history_session
    - restored_session
    - unknown
    entry_point:
    - chat_tab
    - home
    - device
    - kws
    - siri_shortcut
    - app_shortcut
    - deep_link
    - push
    - system_share
    - unknown
    trigger_source:
    - user
    - system
    - device
    - server_push
    - unknown
  privacy_notes: Do not include session id, conversation title, message content, or raw route parameters. Do not include chat text, prompts, answers, transcript text, audio content, image content, memory content, decrypted plaintext, tool arguments, command text, conversation ids, message ids, raw errors, request ids, response bodies, or stack traces.
  ga4_custom_definitions:
  - surface
  - open_mode
  - entry_point
  - trigger_source
  - platform
  - environment
  - build_region
  dashboard_usage:
  - chat_entry_funnel
  - chat_session_open_rate
  verification_android:
  - Enable GA4 DebugView for the Android app stream.
  - Open default, historical, and restored sessions where available and confirm open_mode uses approved enum values.
  - Confirm the event routes through the Android analytics tracker/adapter and uses platform=android.
  - Confirm no chat text, prompt text, answer text, transcript text, audio, image content, memory content, decrypted plaintext, tool arguments, command text, ids, raw errors, or stack traces are present.
  verification_ios:
  - Enable GA4 DebugView for the iOS app stream.
  - Open default, historical, and restored sessions where available and confirm open_mode matches Android.
  - Confirm the iOS analytics facade emits the same event name, params, and enum values as Android with platform=ios.
  - Confirm no chat text, prompt text, answer text, transcript text, audio, image content, memory content, decrypted plaintext, tool arguments, command text, ids, raw errors, or stack traces are present.
- event_name: chat_message_sent
