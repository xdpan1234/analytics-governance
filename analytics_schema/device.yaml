schema_version: 2
owner: device
platforms:
  - android
  - ios
common_properties:
  injected_by_adapter:
    - platform
    - environment
    - build_region
    - build_type
    - app_version_name
    - app_version_code
  definitions:
    platform: Lowercase client platform, such as android or ios.
    environment: Analytics environment, test or prod.
    build_region: Analytics build region. Current Android rule is prod -> us, test -> sg.
    build_type: Client build type such as debug or release.
    app_version_name: Public app version name injected by the client adapter.
    app_version_code: Numeric app version code injected by the client adapter.
implementation_contract:
  android_contract_layer: "domain:api:analytics"
  android_tracker: "AnalyticsTracker"
  android_event_type: "AnalyticsEvent"
  android_event_spec_type: "AnalyticsEventSpec"
  android_provider_adapter: "Ga4AnalyticsAdapter"
  android_direct_sdk_boundary: "Only the app-level provider adapter may call FirebaseAnalytics. Business, feature, domain, and data code must use typed reporters or AnalyticsTracker."
  ios_contract_layer: "iOS analytics facade matching this schema"
  ios_provider_adapter: "GA4/Firebase adapter behind the iOS facade"
  ios_direct_sdk_boundary: "Only the iOS provider adapter may call Firebase Analytics.logEvent. Business code must use the facade."
  required_tests:
    - ga4_event_name_rules
    - ga4_param_name_rules
    - ga4_param_count_limit
    - reserved_prefix_guardrails
    - privacy_field_guardrails
    - reporter_output_contract
events:

  # ── Device Entry & State ──────────────────────────────────────────────────

  - event_name: device_hub_viewed
    goal: Measure device entry exposure volume from Home, Settings, or detail surfaces.
    recommended_or_custom: custom
    key_event: false
    trigger_android: Home, Settings, or detail page renders the formal device entry and status card.
    trigger_ios: Home, Settings, or detail page renders the formal device entry and status card.
    required_properties:
      - entry_point
      - surface
    optional_properties:
      - trigger_source
    allowed_values:
      entry_point:
        - home
        - settings
        - notification
        - unknown
      surface:
        - home
        - settings
        - device
        - unknown
      trigger_source:
        - user
        - system
        - unknown
    privacy_notes: Do not include device name, device address, BLE address, device model string, or MAC address.
    ga4_custom_definitions:
      - entry_point
      - surface
      - trigger_source
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_entry_exposure
      - device_hub_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Navigate to Home and confirm device_hub_viewed appears once with platform=android.
      - Navigate to Settings device section and confirm device_hub_viewed appears with the correct surface and entry_point.
      - Confirm no device name, address, BLE address, device model string, or MAC address is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Navigate to Home and confirm device_hub_viewed appears once with platform=ios.
      - Navigate to Settings device section and confirm device_hub_viewed appears with the correct surface and entry_point.
      - Confirm no device name, address, BLE address, device model string, or MAC address is present.

  - event_name: device_primary_action_tapped
    goal: Measure the distribution of primary device card actions taken by the user.
    recommended_or_custom: custom
    key_event: false
    trigger_android: User taps the primary action on the device card to connect, reconnect, view device details, or enter the firmware upgrade entry point.
    trigger_ios: User taps the primary action on the device card to connect, reconnect, view device details, or enter the firmware upgrade entry point.
    required_properties:
      - surface
      - trigger_source
    optional_properties:
      - entry_point
      - action_type
    allowed_values:
      surface:
        - home
        - settings
        - device
        - unknown
      trigger_source:
        - user
        - unknown
      entry_point:
        - home
        - settings
        - unknown
      action_type:
        - connect
        - reconnect
        - view_details
        - upgrade
        - unknown
    privacy_notes: action_type must be a stable low-cardinality enum. Do not include button label text, device name, or device address.
    ga4_custom_definitions:
      - surface
      - action_type
      - entry_point
      - trigger_source
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_primary_action_breakdown
      - device_hub_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Tap each primary device card action (connect, reconnect, view_details, upgrade) and confirm device_primary_action_tapped appears with the correct action_type for each.
      - Confirm no button label text, device name, or device address is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Tap each primary device card action and confirm device_primary_action_tapped appears with the correct action_type.
      - Confirm no button label text, device name, or device address is present.

  - event_name: device_entry_blocked
    goal: Identify device entry blocked scenarios such as no bound device, forced upgrade gate, or formal permission barrier.
    recommended_or_custom: custom
    key_event: false
    trigger_android: Device entry is blocked by no bound device, forced firmware upgrade requirement, or a formal gate that prevents the user from continuing.
    trigger_ios: Device entry is blocked by no bound device, forced firmware upgrade requirement, or a formal gate that prevents the user from continuing.
    required_properties:
      - failure_reason
      - surface
    optional_properties:
      - entry_point
    allowed_values:
      failure_reason:
        - unsupported_state
        - permission_denied
        - validation_failed
        - network_error
        - timeout
        - sdk_error
        - unknown
      surface:
        - home
        - settings
        - device
        - unknown
      entry_point:
        - home
        - settings
        - notification
        - unknown
    privacy_notes: Do not include raw device state objects, BLE error codes, or device address.
    ga4_custom_definitions:
      - failure_reason
      - surface
      - entry_point
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_entry_block_breakdown
      - device_hub_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Simulate no-bound-device state and confirm device_entry_blocked appears with an approved failure_reason.
      - Simulate forced firmware upgrade gate and confirm device_entry_blocked appears with failure_reason=unsupported_state.
      - Confirm no raw device state objects, BLE error codes, or device address is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Simulate no-bound-device and forced-upgrade gate states and confirm device_entry_blocked appears with approved failure_reason values.
      - Confirm no raw device state objects, BLE error codes, or device address is present.

  # ── Connection & Binding ─────────────────────────────────────────────────

  - event_name: device_binding_started
    goal: Measure entry volume into first-time and rebind device connection flows.
    recommended_or_custom: custom
    key_event: false
    trigger_android: User enters the formal device binding flow from an approved entry point (ConnectGlassViewModel initiated).
    trigger_ios: User enters the formal device binding flow from an approved entry point.
    required_properties:
      - entry_point
      - trigger_source
      - surface
    optional_properties:
      - binding_mode
    allowed_values:
      entry_point:
        - home
        - settings
        - onboarding
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      surface:
        - home
        - settings
        - onboarding
        - unknown
      binding_mode:
        - first_time
        - rebind
        - unknown
    privacy_notes: Do not include pairing code, BLE raw scan data, device address, or device serial number.
    ga4_custom_definitions:
      - entry_point
      - trigger_source
      - surface
      - binding_mode
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_binding_funnel
      - device_binding_entry_breakdown
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Start a first-time binding flow and confirm device_binding_started appears with binding_mode=first_time.
      - Start a rebind flow and confirm device_binding_started appears with binding_mode=rebind.
      - Confirm no pairing code, BLE scan data, device address, or serial number is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Start first-time and rebind binding flows and confirm device_binding_started appears with the correct binding_mode.
      - Confirm no pairing code, BLE scan data, device address, or serial number is present.

  - event_name: device_binding_completed
    goal: Measure device binding success rate.
    recommended_or_custom: custom
    key_event: false
    trigger_android: Pairing succeeds and a formal binding result is formed (BleConnectState.DeviceBonded reached and compatibility check passed). After this event, has_bound_device user property should be set to true.
    trigger_ios: Pairing succeeds and a formal binding result is formed. After this event, has_bound_device user property should be set to true.
    required_properties:
      - surface
      - trigger_source
    optional_properties:
      - entry_point
    allowed_values:
      surface:
        - home
        - settings
        - onboarding
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      entry_point:
        - home
        - settings
        - onboarding
        - unknown
    privacy_notes: Do not include device unique identifier, BLE address, device serial number, or pairing code. After this event, set has_bound_device=true as a GA4 user property.
    ga4_custom_definitions:
      - surface
      - trigger_source
      - entry_point
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_binding_funnel
      - device_binding_success_rate
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Complete a real or controlled binding and confirm device_binding_completed appears once with platform=android.
      - Confirm has_bound_device user property is set to true after the event.
      - Confirm no device unique identifier, BLE address, serial number, or pairing code is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Complete a binding and confirm device_binding_completed appears with platform=ios.
      - Confirm has_bound_device user property is set to true after the event.
      - Confirm no device unique identifier, BLE address, serial number, or pairing code is present.

  - event_name: device_binding_failed
    goal: Identify device binding failure reasons.
    recommended_or_custom: custom
    key_event: false
    trigger_android: The binding flow ends in a failure or timeout state (BleConnectState.Error or compatibility check failure).
    trigger_ios: The binding flow ends in a failure or timeout state.
    required_properties:
      - failure_reason
      - surface
    optional_properties:
      - entry_point
      - binding_mode
    allowed_values:
      failure_reason:
        - network_error
        - permission_denied
        - timeout
        - unsupported_state
        - sdk_error
        - unknown
      surface:
        - home
        - settings
        - onboarding
        - unknown
      entry_point:
        - home
        - settings
        - onboarding
        - unknown
      binding_mode:
        - first_time
        - rebind
        - unknown
    privacy_notes: Map errors to approved failure_reason enum values. Do not include BLE raw error codes, device address, pairing code, or stack trace.
    ga4_custom_definitions:
      - failure_reason
      - surface
      - binding_mode
      - entry_point
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_binding_funnel
      - device_binding_failure_breakdown
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Simulate timeout, permission denial, and pairing failure scenarios and confirm device_binding_failed appears with approved failure_reason values.
      - Confirm no BLE raw error codes, device address, pairing code, or stack trace is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Simulate binding failure scenarios and confirm device_binding_failed appears with approved failure_reason values.
      - Confirm no BLE raw error codes, device address, pairing code, or stack trace is present.

  # ── Device Details & Settings ─────────────────────────────────────────────

  - event_name: device_settings_viewed
    goal: Measure entry volume into the bound device detail or settings page.
    recommended_or_custom: custom
    key_event: false
    trigger_android: User enters the bound device detail or settings page (MyDeviceScreen).
    trigger_ios: User enters the bound device detail or settings page.
    required_properties:
      - entry_point
      - surface
    optional_properties:
      - trigger_source
    allowed_values:
      entry_point:
        - home
        - settings
        - notification
        - unknown
      surface:
        - device
        - settings
        - unknown
      trigger_source:
        - user
        - system
        - unknown
    privacy_notes: Do not include device name text, device address, or device model string.
    ga4_custom_definitions:
      - entry_point
      - surface
      - trigger_source
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_settings_entry
      - device_management_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Open the device detail page from Home and from Settings and confirm device_settings_viewed appears once per navigation with platform=android.
      - Confirm no device name text, device address, or device model string is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Open the device detail page from Home and from Settings and confirm device_settings_viewed appears once per navigation with platform=ios.
      - Confirm no device name text, device address, or device model string is present.

  - event_name: device_setting_updated
    goal: Measure formal device setting submission volume.
    recommended_or_custom: custom
    key_event: false
    trigger_android: User completes a formal device setting update, calibration, unbind, or reset submission (DeviceScreenEvent or GeneralOperate action confirmed).
    trigger_ios: User completes a formal device setting update, calibration, unbind, or reset submission.
    required_properties:
      - surface
      - trigger_source
    optional_properties:
      - entry_point
      - setting_type
    allowed_values:
      surface:
        - device
        - settings
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      entry_point:
        - device
        - settings
        - unknown
      setting_type:
        - rename
        - unbind
        - reset
        - restart
        - calibrate
        - kws_toggle
        - video_length
        - unknown
    privacy_notes: setting_type must be a stable enum. Do not include user-entered device name text, user input content, or raw setting values.
    ga4_custom_definitions:
      - surface
      - trigger_source
      - setting_type
      - entry_point
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_setting_type_breakdown
      - device_management_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Trigger each setting type (rename, unbind, reset, restart, calibrate, kws_toggle, video_length) and confirm device_setting_updated appears with the correct setting_type.
      - Confirm no user-entered text, raw setting values, or device address is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Trigger each setting type and confirm device_setting_updated appears with the correct setting_type.
      - Confirm no user-entered text, raw setting values, or device address is present.

  - event_name: device_setting_update_failed
    goal: Identify device setting failure scale and failure reasons.
    recommended_or_custom: custom
    key_event: false
    trigger_android: A formal setting update is blocked or fails before completing (device disconnected, network failure, or SDK error during setting submission).
    trigger_ios: A formal setting update is blocked or fails before completing.
    required_properties:
      - failure_reason
      - surface
    optional_properties:
      - setting_type
      - entry_point
    allowed_values:
      failure_reason:
        - network_error
        - permission_denied
        - timeout
        - unsupported_state
        - sdk_error
        - unknown
      surface:
        - device
        - settings
        - unknown
      setting_type:
        - rename
        - unbind
        - reset
        - restart
        - calibrate
        - kws_toggle
        - video_length
        - unknown
      entry_point:
        - device
        - settings
        - unknown
    privacy_notes: Do not include failure detail text, raw error message, device address, or user-entered content.
    ga4_custom_definitions:
      - failure_reason
      - surface
      - setting_type
      - entry_point
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_setting_failure_breakdown
      - device_management_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Simulate device disconnect and network failure during a setting update and confirm device_setting_update_failed appears with an approved failure_reason.
      - Confirm no failure detail text, raw error message, or device address is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Simulate setting update failures and confirm device_setting_update_failed appears with approved failure_reason values.
      - Confirm no failure detail text, raw error message, or device address is present.

  # ── Device Info Sync & Naming ─────────────────────────────────────────────

  - event_name: device_sync_evaluated
    goal: Measure device info sync trigger volume.
    recommended_or_custom: custom
    key_event: false
    trigger_android: The formal sync chain begins evaluating device name, firmware version, connection state reporting, or unbind cleanup (MyDeviceViewModel.refreshVersion() or BLE state flow update).
    trigger_ios: The formal sync chain begins evaluating device name, firmware version, connection state reporting, or unbind cleanup.
    required_properties:
      - surface
      - trigger_source
    optional_properties:
      - sync_type
    allowed_values:
      surface:
        - device
        - settings
        - home
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      sync_type:
        - name
        - version
        - connection_state
        - unbind_cleanup
        - unknown
    privacy_notes: Do not include device name text, raw location data, BLE address, or firmware version string.
    ga4_custom_definitions:
      - surface
      - trigger_source
      - sync_type
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_sync_volume
      - device_sync_funnel
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Trigger a manual device name update or version refresh and confirm device_sync_evaluated appears with the correct sync_type.
      - Confirm no device name text, location data, BLE address, or firmware version string is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Trigger a sync evaluation and confirm device_sync_evaluated appears with the correct sync_type and platform=ios.
      - Confirm no device name text, location data, BLE address, or firmware version string is present.

  - event_name: device_sync_completed
    goal: Measure device info sync completion rate.
    recommended_or_custom: custom
    key_event: false
    trigger_android: The formal sync chain produces a visible completion result (name, version, or connection state sync succeeds).
    trigger_ios: The formal sync chain produces a visible completion result.
    required_properties:
      - surface
      - trigger_source
    optional_properties:
      - sync_type
    allowed_values:
      surface:
        - device
        - settings
        - home
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      sync_type:
        - name
        - version
        - connection_state
        - unbind_cleanup
        - unknown
    privacy_notes: sync_type must be a stable enum. Do not include device name text, firmware version string, or BLE address.
    ga4_custom_definitions:
      - surface
      - trigger_source
      - sync_type
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_sync_funnel
      - device_sync_completion_rate
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Complete a device name sync and a version sync and confirm device_sync_completed appears with the correct sync_type for each.
      - Confirm no device name text, firmware version string, or BLE address is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Complete sync flows and confirm device_sync_completed appears with the correct sync_type and platform=ios.
      - Confirm no device name text, firmware version string, or BLE address is present.

  - event_name: device_sync_failed
    goal: Identify device info sync failure reasons.
    recommended_or_custom: custom
    key_event: false
    trigger_android: The formal sync chain fails or compensation does not complete (server write failure, timeout, or network error).
    trigger_ios: The formal sync chain fails or compensation does not complete.
    required_properties:
      - failure_reason
      - surface
    optional_properties:
      - sync_type
    allowed_values:
      failure_reason:
        - network_error
        - timeout
        - permission_denied
        - unsupported_state
        - sdk_error
        - unknown
      surface:
        - device
        - settings
        - home
        - unknown
      sync_type:
        - name
        - version
        - connection_state
        - unbind_cleanup
        - unknown
    privacy_notes: Do not include raw location data, device name text, raw error message, or firmware version string.
    ga4_custom_definitions:
      - failure_reason
      - surface
      - sync_type
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_sync_funnel
      - device_sync_failure_breakdown
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Simulate a server write failure during sync and confirm device_sync_failed appears with an approved failure_reason.
      - Confirm no location data, device name text, raw error message, or firmware version string is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Simulate sync failures and confirm device_sync_failed appears with approved failure_reason values and platform=ios.
      - Confirm no location data, device name text, or raw error message is present.

  # ── Auto-Reconnect & Disconnection Recovery ───────────────────────────────

  - event_name: device_reconnect_started
    goal: Measure reconnect initiation volume.
    recommended_or_custom: custom
    key_event: false
    trigger_android: The formal auto-reconnect (LTBleManager recovery, trigger_source=system) or manual reconnect (HomeViewModel.reconnect(), trigger_source=user) chain begins after a disconnection.
    trigger_ios: The formal auto-reconnect or manual reconnect chain begins after a disconnection.
    required_properties:
      - entry_point
      - trigger_source
      - surface
    optional_properties:
      - reconnect_mode
    allowed_values:
      entry_point:
        - home
        - settings
        - background
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      surface:
        - home
        - settings
        - device
        - background
        - unknown
      reconnect_mode:
        - auto
        - manual
        - unknown
    privacy_notes: Do not include raw BLE event stream, device address, or low-level connection error codes.
    ga4_custom_definitions:
      - entry_point
      - trigger_source
      - surface
      - reconnect_mode
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_reconnect_funnel
      - device_reconnect_volume
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Simulate a disconnect and trigger auto-reconnect; confirm device_reconnect_started appears with reconnect_mode=auto and trigger_source=system.
      - Manually trigger reconnect from Home; confirm device_reconnect_started appears with reconnect_mode=manual and trigger_source=user.
      - Confirm no BLE event stream, device address, or low-level error codes are present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Simulate auto and manual reconnect and confirm device_reconnect_started appears with the correct reconnect_mode and platform=ios.
      - Confirm no BLE event stream, device address, or low-level error codes are present.

  - event_name: device_reconnect_completed
    goal: Measure reconnect success rate after disconnection.
    recommended_or_custom: custom
    key_event: false
    trigger_android: Reconnection completes and the device returns to the usable connected state (AirChannelStatus.CONNECTED restored).
    trigger_ios: Reconnection completes and the device returns to the usable connected state.
    required_properties:
      - surface
      - trigger_source
    optional_properties:
      - reconnect_mode
    allowed_values:
      surface:
        - home
        - settings
        - device
        - background
        - unknown
      trigger_source:
        - user
        - system
        - unknown
      reconnect_mode:
        - auto
        - manual
        - unknown
    privacy_notes: reconnect_mode must be a stable enum. Do not include device address or BLE raw event data.
    ga4_custom_definitions:
      - surface
      - trigger_source
      - reconnect_mode
      - platform
      - environment
      - build_region
    dashboard_usage:
      - device_reconnect_funnel
      - device_reconnect_success_rate
    verification_android:
      - Enable GA4 DebugView for the Android app stream.
      - Simulate a disconnect and allow auto-reconnect to succeed; confirm device_reconnect_completed with reconnect_mode=auto.
      - Manually trigger reconnect to success; confirm device_reconnect_completed with reconnect_mode=manual.
      - Confirm no device address or BLE raw event data is present.
    verification_ios:
      - Enable GA4 DebugView for the iOS app stream.
      - Confirm device_reconnect_completed appears with the correct reconnect_mode and platform=ios after a successful reconnect.
      - Confirm no device address or BLE raw event data is present.

  - event_name: device_reconnect_failed
    goal: Identify reconnect failure reasons.
    recommended_or_custom: custom
    key_event: false
    trigger_android: Auto-reconnect or manual reconnect ends in a failed state (timeout, user cancellation, or BLE error mapped to approved failure_reason).
    trigger_ios: Auto-reconnect or manual reconnect ends in a failed state.
    required_properties:
      - failure_reason
      - surface
    optional_properties:
      - reconnect_mode
      - entry_point
    allowed_values:
      failure_reason:
        - network_error
        - permission_denied
        - timeout
        - unsupported_state
        - sdk_error
        - unknown
      surface:
        - home
        - settings
        - device
        - background
        - unknown
      reconnect_mode:
        - auto
        - manual
        - unknown
      entry_point:
        - home
        - settings
        - background
        - unknown
    privacy_notes: Map BLE errors to approved failure_reason values. Do not include BLE error stack, device address, or raw connection state dump.
    ga4_custom_definitions:
