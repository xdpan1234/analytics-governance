worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    server {
        listen 8080 default_server;
        server_name _;
        default_type application/json;
        return 403 '{"error":{"code":"LOCAL_ONLY","message":"仅允许本机访问。"}}';
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        default_type application/json;
        if ($http_sec_fetch_site = "cross-site") { return 403 '{"error":{"code":"LOCAL_ONLY","message":"仅允许本机同站点访问。"}}'; }
        location /api/ {
            set $backend http://api:8091;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
        }
        location = /healthz {
            set $backend http://api:8091;
            proxy_pass $backend/api/healthz;
            proxy_set_header Host $http_host;
            proxy_hide_header Cache-Control;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
