name: analytics-management
services:
  api:
    build: .
    image: analytics-management-api:1.0
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: analytics_management
      PGUSER: analytics_reader
      PGPASSWORD: ${ANALYTICS_READER_PASSWORD:?Run setup_local.py first}
      ANALYTICS_SCOPE: ai.looktech.glasses.memo/prod/us/release
    networks: [ui, backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 5s
      start_interval: 1s
  web:
    build: ./frontend
    image: analytics-management-ui:1.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8080'
    depends_on:
      api:
        condition: service_healthy
    networks: [ui]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/healthz']
      interval: 30s
      timeout: 6s
      retries: 3
  import:
    image: analytics-management-api:1.0
    profiles: [tools]
    user: '${ANALYTICS_LOCAL_UID:?}:${ANALYTICS_LOCAL_GID:?}'
    command: [python, import_cached.py, --archive, /archive, --snapshot, /snapshot]
    environment:
      PGHOST: postgres
      PGDATABASE: analytics_management
      PGUSER: analytics_importer
      PGPASSWORD: ${ANALYTICS_IMPORTER_PASSWORD:?Run setup_local.py first}
      ANALYTICS_SCOPE: ai.looktech.glasses.memo/prod/us/release
    volumes:
      - ${ANALYTICS_ARCHIVE_DIR:?Set cached archive directory}:/archive:ro
      - ${ANALYTICS_SNAPSHOT_DIR:?Set frozen snapshot directory}:/snapshot:ro
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  ui:
    driver: bridge
  backend:
    external: true
    name: log-backend-local_default
